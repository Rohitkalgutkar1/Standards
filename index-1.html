var C=["#d62828","#1d6fe0","#2b9348","#f2a900","#8d5524","#7b2cbf","#64748b","#0d9488","#e11d8f"];

{id:"home",t:"Start here",c:0},
{id:"harness",t:"Harness drawing",c:3,img:"harness.png"},
{id:"wire",t:"Wires",c:1,
pts:["Wire = copper conductor + PVC insulation. It carries current, power and signals from one end to another.","Two automotive standards in the notes: DIN 72551 (Germany, FLRY family) and JASO D611 (Japan, AV family).","FLRY decoder: FL = flexible low-tension, R = reduced insulation thickness, Y = PVC, A = symmetrical strands, B = random strands.","JASO decoder: A automotive, V vinyl, S slim, SS super slim, E polyethylene, X cross-linked polymer.","Temperature: FLRY-A/B/H −40 to 105 °C, FLRY-K −50 to 105 °C, FLRY-W −40 to 125 °C. AV/AVS 85 °C, AVSS 120 °C, CAVS 80 °C, AVX 100 °C, AEX 120 °C.","Pick wire by 3 factors: area of application (engine bay is hotter, so a higher temp class), load current, voltage drop.","Voltage drop = I × R. Allowed: 3 to 5 % of supply, so 0.6 V at 12 V.","Worked example: 10 A, 5 m, 0.5 mm² (37 mΩ/m) gives 185 mΩ; add 5 × 4 mΩ terminal/splice = 205 mΩ; V = 10 × 0.205 = 2.05 V. Too much, so upsize the wire and recalculate."],
mn:"Cabin = cool = low class. Engine bay = hot = high class. Always check voltage drop AFTER the current check.",more:["The colour-code test at the end of the line catches swapped circuits, so drawing colours must match the wire chart.","Bundle diameter grows with every wire added, so size the cott tube only after the wire count is final.","Terminal contacts and splices add resistance (typically 4 mΩ each), so count them in every voltage-drop sum."],
qa:[["How do you select a wire size?","Find load current (I = P / V if not given, e.g. 60 W / 12 V = 5 A), choose the size from the FLRYB table whose capacity covers it, then calculate voltage drop. If drop exceeds 3–5 %, increase the size and recalculate."],["Why calculate voltage drop?","Long circuits and terminal contacts add resistance. Too much drop starves the load (dim lamps, weak motors)."],["What does FLRYB mean?","Flexible low-tension, Reduced insulation, PVC (Y), B = random strand arrangement."],["Twisted vs shielded cable?","Twisted pairs (music, camera) avoid internal interference. Shielded cable adds a foil wrap for double protection against external interference (e.g. TV cable)."],["Wire pull-force validation?","Terminal and splice get a pull-force test: 0.35 mm² 5–7 kg, 0.5 mm² 7.5–10 kg, 0.75 mm² 10–12.5 kg, 1.0 mm² 12.5–15 kg (typical values)."]],
qz:[["What allowed voltage drop applies to a 12 V supply (5 %)?",["0.6 V","2.05 V","1.2 V"],0],["Which letter in FLRY means PVC insulation?",["R","Y","L"],1],["Which wire gets the higher temperature class?",["Cabin wire","Engine bay wire","Door wire"],1],["10 A, 5 m of 0.5 mm² wire gave 2.05 V drop. Next step?",["Accept it","Use a thinner wire","Increase wire size and recalculate"],2],["JASO “S” stands for…",["Slim (reduced insulation)","Shielded","Steel"],0]]},
{id:"conn",t:"Terminals & connectors",c:2,
pts:["Terminal series = tab width ÷ 25.4. Example: 2.3 mm ÷ 25.4 ≈ 0.090, so a 090 series terminal.","Common series and tab widths: 030 (0.8), 040 (1.0), 070 (1.8), 090 (2.3), 110 (2.8), 187 (4.8), 250 (6.3), 312 (7.9 mm).","Terminal types: tab (male), receptacle (female), ring (LA), JPT, SPT, sealed and unsealed.","Plating avoids corrosion and raises conductivity: tin (Sn), silver (Ag), gold (Au). Gold is for sensitive signals such as airbag.","Terminal selection: load current, wire size, application area, compatibility with the connector cavity. Ring terminal ID depends on bolt size.","Connectors: housing for female terminals (male connector) or male terminals (female connector); simple vs hybrid; sealed, unsealed, supersealed; PCB/JST.","Sealed = engine bay, tailgate (exposed to environment). Unsealed = cabin.","Simple connector = one series in the housing. Hybrid = mixed series, e.g. 8 cavities of 110 + 2 of 250.","Secondary lock / TPA stops terminal backout caused by vibration. CPA = connector position assurance.","Connector material: Nylon 66 or PBT. Makers (terminals): Delphi, Molex, Yazaki, Sumitomo, TE, JST, Haidi, KET."],
mn:"Tab width ÷ 25.4 = series. 2.8 mm → 110, 4.8 mm → 187, 6.3 mm → 250.",more:["Never mix series in one cavity: a 250 terminal will not seat in a 110 cavity.","Fill every empty cavity of a sealed connector with a dummy plug, or water finds a path in.","Connector series follows terminal series, and so do the manufacturers."],
qa:[["Why gold-plated terminals and where?","Airbag connections carry a very sensitive signal, so gold gives high sensitivity and conductivity."],["Why use connectors instead of joints?","Joints can fail from vibration or wire stress and cause discontinuity. Connectors give better serviceability, save time and are easy to assemble and remove."],["What is a secondary lock?","A TPA-style lock that prevents terminals backing out of the cavity when the vehicle vibrates."],["Sealed vs unsealed connector?","Sealed has seals at the rear and mating side for areas that meet the environment (engine bay). Unsealed has none (cabin)."],["How do you choose a connector?","Match the mating connector, count circuits (10 wires → 10 or 12 pole), pick type by area (sealed in engine bay), and use load current to choose terminal series, simple or hybrid."],["What are inline connectors?","They join different harnesses, e.g. body to door, body to engine, body to tailgate, IP to roof."]],
qz:[["Tab width 2.8 mm. Series?",["090","110","187"],1],["Which plating suits an airbag signal?",["Tin","Silver","Gold"],2],["Engine bay connector type?",["Unsealed","Sealed / supersealed","Any"],1],["What does TPA prevent?",["Water entry","Terminal backout","Overheating"],1],["A housing with 110 and 250 cavities is…",["Simple","Hybrid","Inline"],1]]},
{id:"prot",t:"Protection & support",c:3,
pts:["Cott (corrugated) tube: mechanical protection, hides open wires, but cuts flexibility. Slit or unslit. For a 10 mm bundle pick 13 mm ID.","Cott colours: PP black (−20 to 100 °C), HR black + blue stripe (to 135 °C), FR black + yellow/white stripe (to 135 °C), Nylon black (to 180 °C).","Sleeve (PVC) covers wires where flexibility is needed. Tape bundles wires: spot 100–200 mm, spiral = bundle length × 2, overlap = × 4. PVC tape is normal; cotton and cloth are high-temp.","HST (heat shrink tube) covers splices and ring terminal crimps. Sealed type has glue.","Fuse = 30 % above load current (10 A → 13 A, 20 A → 26 A) because self-heating raises resistance and lowers capacity.","Fuse types: mini (up to 30 A, fast blow, 350 %, 0.5 s), maxi (40–70 A, slow blow, 600 %, 1 s), mega (80 A+).","Relay: low-current switch operates a high-current circuit. Pins 85/86 coil, 30/87 contact. NO, NC or changeover (87a). Micro 20 A, mini 40 A, power 70 A at 12 V.","Grommet protects the harness at sheet-metal holes: EPDM for high temp, NBR for low temp. Outer dia fits the hole, inner dia fits the bundle or water gets in.","Clips and brackets support the harness: clips in Nylon 66, brackets in steel. Wire seal waterproofs a wire; dummy (cavity) plug seals empty cavities."],
mn:"Fuse = load × 1.3. Tape: spot 100–200, spiral ×2, overlap ×4.",more:["Read the cott tube stripe: blue = heat resistant, yellow/white = flame retardant.","Place clips near branch-outs so a branch cannot flap and wear.","Round a calculated fuse up to the next standard rating (5, 7.5, 10, 15, 20, 25, 30 A…)."],
qa:[["Why 30 % extra on a fuse?","Current heats the fuse, raising its resistance and cutting its capacity, so the 30 % margin covers that self-heating."],["Why use a relay?","So a low-current switch can control a high-current load such as headlamps."],["Why a grommet?","To protect the harness from sharp sheet-metal edges and to stop water entering between compartments."],["Tape length for a 200 mm bundle?","Spiral 200 × 2 = 400 mm. Overlap 200 × 4 = 800 mm."],["Slow-blow vs fast-blow fuse?","Slow blow (maxi): 600 % of rating, 1 s, high ratings. Fast blow (mini): 350 %, 0.5 s, low ratings."]],
qz:[["Fuse for a 20 A load?",["22 A","26 A","40 A"],1],["Spiral taping 200 mm bundle needs…",["200 mm","400 mm","800 mm"],1],["Relay coil pins?",["30 / 87","85 / 86","87 / 87a"],1],["Grommet for high temperature?",["EPDM","NBR","PVC"],0],["Cott tube for 10 mm bundle?",["10 mm ID","13 mm ID","7 mm ID"],1]]},
{id:"proc",t:"Design & process",c:4,
pts:["Design flow: customer 3D data + application list → assemble components → DFMEA → concept routing → approval → flattening + rough 2D → circuit schematic team gives wire size/length → bundle diameter → actual routing.","2D drawing shows connectors, splices, clips, grommets, covering, branch orientation, dimensions, title block, revision history, tolerance chart.","Wire chart (address sheet): circuit no., length, size, colour, from/to position, connector, cavity, terminal. Splice chart lists each circuit in the splice. Item chart lists everything except wires.","Splice balancing: LHS : RHS ratio 1 : 3 maximum.","3D routing rules: away from heat, sharp edges, moving/rotating parts; clips 200–300 mm apart; splices and branch-outs ≥ 50 mm apart; branch ≥ 100 mm; bend radius ratio ≥ 1; slack never zero.","Manufacturing: cutting chart with tolerance → cut wire → seal insertion → terminal crimp → sub-assembly (splices) → main assembly on laying board → taping/clips → EOL test (continuity, colour code) → rework or final inspection → packing & dispatch.","Reverse engineering: sample from customer → layout → mark all data → wire chart from continuity → prototype → test → freeze (repeat until OK).","VAVE = cut cost without losing quality. DFMEA = find failure, study effect, get Risk Priority Number. ECR = document of changes after initial design."],
mn:"Design → Prototype → Test → Freeze → Release. Splice balance 1:3.",more:["Release the drawing and the wire chart together; a mismatch causes rework on the shop floor.","Run the routing checklist (heat, edges, moving parts, slack) before asking for concept approval.","Any connector change goes through cost estimation and customer approval before the drawing changes."],
qa:[["What is a 2D drawing?","A 2D representation of 3D data showing connectors, clips, grommets, splices and coverings with clear position numbers for manufacturing."],["Need for a splice chart?","One wire is common to more than one application, so the splice chart records what joins there."],["If you change a connector in the drawing?","Discuss with the team → prepare CECE (cost estimation) → purchase gives costing → discuss with customer → on approval change the drawing."],["What is DFMEA?","Detect possible failures, study their effect on design, then compute the Risk Priority Number."],["Drawing release process?","Finalise drawing and charts → CFT meeting → hand over to distribution → distribution hands to production."],["Validation tests?","Terminal and splice: pull-force. Sealed connector and HST: water-depth test."]],
qz:[["Maximum splice balance ratio?",["1:1","1:3","1:10"],1],["Clip spacing maximum?",["50 mm","100 mm","200–300 mm"],2],["What does EOL testing check?",["Weight","Continuity and colour code","Paint"],1],["VAVE aims to…",["Cut cost, keep quality","Add features","Speed up routing"],0],["Minimum branch length?",["50 mm","100 mm","300 mm"],1]]},
{id:"ev",t:"Electric vehicles",c:5,
pts:["Three vehicle types: conventional (IC engine), electric (battery + motor), hybrid (both, series or parallel).","EV parts: battery bank, circuit breaker, motor controller, BLDC motor, battery charger, DC-DC converter.","Battery: lead-acid or lithium-ion, e.g. 48 V 100 Ah or 72 V 40 Ah.","Motor controller: size for motor peak current. 72 V 30 A motor with 40 A peak → 72 V 50 A controller.","DC-DC converter steps 72 V or 48 V down to 12 V for lamps, wipers and other loads.","Charging time = battery Ah ÷ charger A (ideal). 72 V 50 Ah with a 10 A charger ≈ 5 h. Energy 72 × 50 = 3.6 kWh ≈ 4 units."],
mn:"Time = Ah ÷ A. Energy = V × Ah.",more:["Energy in kWh = V × Ah ÷ 1000, which is also the number of electricity units to fill the pack.","Real charging takes longer than the ideal figure because of losses.","Size the DC-DC converter from the total 12 V load of all lamps, wipers and other applications."],
qa:[["Why a DC-DC converter?","Everything except motor and controller runs on 12 V, so it steps down 48/72 V."],["Charging time for 72 V 50 Ah on a 10 A charger?","50 ÷ 10 = 5 h at 100 % efficiency; 3.6 kWh of energy."],["Which controller for a 72 V 30 A motor with 40 A peak?","72 V 50 A, chosen above the peak current."],["Quick check: 100 Ah battery on a 15 A charger?","Ah ÷ A gives about 6.7 h in the ideal case, and more with losses."]],
qz:[["Energy of 72 V 50 Ah?",["3.6 kWh","7.2 kWh","50 kWh"],0],["Which part steps 72 V to 12 V?",["BLDC motor","DC-DC converter","Relay"],1],["100 Ah on a 50 A charger (ideal)?",["2 h","5 h","8.5 h"],0],["Hybrid vehicle has…",["Only a battery","Only an engine","Engine + battery + motor"],2]]},
{id:"gate",t:"Logic gates",c:7,
pts:["A logic gate turns inputs (ON = 1, OFF = 0) into one output. Many harness circuits are switch logic in disguise.","AND: output ON only when ALL inputs are ON. Switches in series = AND, e.g. ignition AND headlamp switch.","OR: output ON when ANY input is ON. Switches in parallel = OR, e.g. hazard OR turn stalk, door L OR door R.","NOT: flips the signal. A normally-closed (NC) relay contact behaves as NOT.","NAND = NOT(AND) and NOR = NOT(OR). They are the base of many controller checks.","AND truth table: 00→0, 01→0, 10→0, 11→1. OR truth table: 00→0, 01→1, 10→1, 11→1.","A relay is a gate building block: the coil is the input, the contact is the output. NO copies the input, NC inverts it, a changeover (87 / 87a) gives both.","A diode in each branch lets two signals drive one load (OR) without feeding back into each other."],
mn:"Series = AND (all must be ON). Parallel = OR (any one is enough). NC relay = NOT.",
more:["Draw it first: a series chain of switches is an AND, a ladder of branches is an OR.","Wrong order of brackets gives wrong logic, so always bracket groups."],
x:"<div class=\"card\" id=\"lab1\"></div>",
qa:[["How do series and parallel switches map to gates?","Series switches need all ON, so they act as AND. Parallel switches need any ON, so they act as OR."],["How does a relay act like a gate?","The coil is the input and the contact the output. A NO contact passes the signal, an NC contact inverts it (NOT)."],["What is a truth table?","A list of every input combination with the resulting output, used to verify a circuit."],["Why put diodes in an OR circuit?","They stop one source from feeding current back into the other circuit."]],
qz:[["Two switches in series behave like…",["OR","AND","NOT"],1],["Hazard OR turn stalk lights the indicator. Which gate?",["AND","OR","NAND"],1],["An NC relay contact acts like…",["NOT","AND","OR"],0],["AND with inputs 1 and 0 gives…",["1","0","Either"],1],["NOR is…",["OR followed by NOT","AND followed by NOT","Just OR"],0]]},
{id:"logic",t:"Circuit solving",c:8,
pts:["Step 1: list inputs (switches, sensors) and outputs (lamps, motors, relay coils).","Step 2: write each output as a sentence: Headlamp coil = IGN AND HEAD.","Step 3: series → AND, parallel → OR, NC contact → NOT. Use brackets for groups.","Step 4: test with a truth table or the key cases (all OFF, all ON, one ON).","Step 5: do the harness maths: current = P ÷ V, wire size from the table, fuse = load × 1.3, then voltage drop.","Example: 60 W headlamp at 12 V draws 5 A. The relay contact carries 5 A, the switch only carries the small coil current. Fuse = 5 × 1.3 = 6.5 A, so pick 7.5 A.","Example: Left indicator = (LEFT AND IGN) OR HAZARD. Hazard must work with ignition OFF, which is why brackets matter.","Example: EV controller enable = IGN AND NOT BRAKE, matching the brake-switch cut-off on the block diagram."],
mn:"Logic first, then maths: expression → truth table → current → wire → fuse → voltage drop.",
more:["If a result looks wrong, test the case that should be OFF; most bugs hide there.","Group by output, not by switch: one expression per lamp or motor."],
x:"<div class=\"card\" id=\"lab2\"></div>",
qa:[["How do you solve a harness circuit with gates?","List inputs and outputs, write one Boolean expression per output, map series to AND and parallel to OR, verify with a truth table, then size wire and fuse."],["Why use a relay for the headlamp?","The switch carries only coil current, while the 5 A lamp load goes through the relay contact and a short, thick wire."],["Why must hazard work with ignition OFF?","It is a safety function, so it is wired as OR directly from supply, not through the ignition AND."],["Which fuse for a 5 A load?","5 × 1.3 = 6.5 A, so the next standard rating, 7.5 A."]],
qz:[["Headlamp relay coil logic?",["IGN OR HEAD","IGN AND HEAD","NOT HEAD"],1],["Roof lamp with two doors?",["DOOR L OR DOOR R","DOOR L AND DOOR R","NOT DOOR"],0],["(LEFT AND IGN) OR HAZARD with ignition OFF and hazard ON?",["Lamp ON","Lamp OFF"],0],["60 W bulb at 12 V draws…",["0.5 A","5 A","50 A"],1],["Standard fuse for 6.5 A calculated?",["5 A","7.5 A","15 A"],1]]},
{id:"new",t:"Latest standards & tips",c:6,
pts:["ISO 19642 – road-vehicle automotive cables; it replaces ISO 6722 and covers temperature classes A–H (85 to 250 °C), the same temperature classes used for wire selection.","ISO 8092 – connections for on-board harnesses (tab dimensions, terminal/connector basics).","USCAR-21 (terminal-wire crimp performance) and USCAR-2 (connector system performance) – widely used validation specs.","ISO 8820 – road-vehicle fuse-links (blade fuses). ISO 16750 – environmental conditions for electrical equipment.","IPC/WHMA-A-620 – acceptance requirements for cable and wire harness assemblies.","ISO 26262 – functional safety, relevant to safety circuits like airbag and brake.","High voltage EVs: HV cables and connectors are orange by convention, shielded, with HVIL interlock. 48 V mild-hybrid systems add a second voltage domain.","Trends: aluminium conductors for weight, thin-wall cables, automotive Ethernet (single twisted pair), zonal architecture to shorten harnesses."],
tips:["Always keep a 10–20 % current margin on wire ratings and derate for bundles and heat.","Crimp height and pull-force checks catch most terminal faults early.","Seal every unused cavity with a dummy plug in wet areas.","Mark one-point routing checks: heat, edges, moving parts, clip spacing.","Standards get revised, so confirm the current edition before releasing a drawing."],
mn:"DIN and JASO teach the basics. Modern projects cite ISO 19642 + USCAR-21 + IPC/WHMA-A-620.",
qa:[["Which standard replaced ISO 6722?","ISO 19642 for road-vehicle cables."],["Which spec validates crimp quality?","USCAR-21 for terminal-wire crimps."],["Why orange for HV cables?","It warns that the circuit is high voltage; it is an industry convention backed by OEM and ISO 6469 requirements."]],
qz:[["ISO 19642 covers…",["Fuses","Automotive cables","Tapes"],1],["IPC/WHMA-A-620 is about…",["Harness assembly acceptance","Battery charging","Tyres"],0],["HV cables are usually coloured…",["Orange","Green","Grey"],0]]}
];
var P={wire:["Trunk wires","Copper conductor with PVC insulation, bundled into the main trunk."],conn:["Connector","Joins harnesses to parts. Sealed in engine bay, unsealed in cabin. Has TPA/secondary lock."],term:["Terminal","Crimped on the wire end inside the connector. Gold, silver or tin plated."],cott:["Cott tube","Corrugated tube for mechanical protection. Reduces flexibility."],tape:["Tape","Bundles wires. Spot, spiral or overlap taping."],clip:["Clip","Nylon 66 clip supports and mounts the harness. Max 200–300 mm apart."],splice:["Splice","Joins two or more wires, made by crimping or ultrasonic welding."],hst:["Heat shrink tube","Covers splice and ring terminal crimps. Glue type seals."],ring:["Ring terminal","Bolted to body or battery. Inner diameter matches the bolt size."],fuse:["Fuse box","Fuses protect wires from short circuit. Size = load × 1.3."],relay:["Relay","Low-current switch controls a high-current load. Pins 85/86 coil, 30/87 contact."],grommet:["Grommet","EPDM or NBR rubber protects the harness at a sheet-metal hole and keeps water out."]};
